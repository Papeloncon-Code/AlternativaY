# CI/CD de TodoTube.
# CI: compilación, tipos y Playwright contra una API local determinista; pruebas del servicio de avisos y gateway si existe.
# CD: solo push a main y tras pasar todos los jobs; smoke mínimo contra producción. No aplica migraciones D1.
name: CI/CD

on:
  push:
    branches: [sdd/investigacion-y-especificacion, main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PROD_URL: https://todotube.papelon.workers.dev

jobs:
  avisos:
    name: Servidor de avisos · pruebas
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: spikes/websub } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: spikes/websub/package-lock.json }
      - run: npm ci
      - run: npm test

  web:
    name: Web · compilación, tipos y pruebas de aceptación
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx tsc -b
      - run: npx playwright install --with-deps chromium
      - name: Iniciar API local determinista para Playwright
        env: { E2E_API_PORT: '4174' }
        run: |
          node scripts/e2e-api.mjs > /tmp/todotube-e2e-api.log 2>&1 &
          echo $! > /tmp/todotube-e2e-api.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/health >/dev/null; then
              echo "API de pruebas lista."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/todotube-e2e-api.log
          exit 1
      # La suite valida la UI y los contratos API conocidos sin leer D1 ni usar datos mutables de producción.
      - name: Pruebas de aceptación Playwright
        env: { E2E_API_TARGET: 'http://127.0.0.1:4174' }
        run: npx playwright test --trace off
      - if: always()
        name: Detener API local
        run: |
          if [ -f /tmp/todotube-e2e-api.pid ]; then kill "$(cat /tmp/todotube-e2e-api.pid)" 2>/dev/null || true; fi
      - name: Guardar capturas y medidas de auditoría visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todotube-visual-audit-${{ github.sha }}
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

  gateway:
    name: Media Gateway · pruebas unitarias
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/media-gateway } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: apps/media-gateway/package-lock.json }
      - run: npm ci
      - run: npm test

  desplegar:
    name: Despliegue en Cloudflare y humo en producción
    needs: [avisos, web, gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Comprobar secretos
        id: secretos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Falta CLOUDFLARE_API_TOKEN: no se despliega."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Avisar que el despliegue quedó desactivado
        if: steps.secretos.outputs.ok != 'true'
        run: echo "::notice::CI pasó, pero no hay credenciales Cloudflare. No se modificó producción."
      - name: Servidor de avisos
        if: steps.secretos.outputs.ok == 'true'
        working-directory: spikes/websub
        run: npm ci && npx wrangler deploy
      - name: Web
        if: steps.secretos.outputs.ok == 'true'
        working-directory: apps/web
        run: npm ci && npm run build && npx wrangler deploy
      # Comprobación de disponibilidad básica; la suite de interacción completa ya corre contra fixtures en CI.
      - name: Pruebas de humo contra la web publicada
        if: steps.secretos.outputs.ok == 'true'
        working-directory: apps/web
        env: { BASE_URL: '${{ env.PROD_URL }}' }
        run: node scripts/smoke.mjs
