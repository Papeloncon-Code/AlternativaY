name: D1 · aplicar índices 008

# Ejecución manual y opt-in. Nunca se ejecuta al hacer push ni forma parte del despliegue normal.
# Este job usa un token independiente: CLOUDFLARE_D1_API_TOKEN (Account D1 Edit).
on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Confirmo crear/verificar los índices 008 en la D1 remota alternativay-websub."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply-indexes:
    name: Aplicar índices 008 a D1 (remoto)
    if: inputs.confirm_apply == true
    runs-on: ubuntu-latest
    environment: produccion
    defaults:
      run:
        working-directory: spikes/websub
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spikes/websub/package-lock.json
      - name: Comprobar credenciales D1
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta CLOUDFLARE_D1_API_TOKEN en los secretos del entorno produccion."
            exit 1
          fi
      - run: npm ci
      - name: Estado previo de los índices
        run: |
          npx wrangler d1 execute alternativay-websub --remote --command="SELECT name, tbl_name FROM sqlite_master WHERE type='index' AND name IN ('idx_events_received','idx_events_video','idx_runs_at','idx_videos_channel','idx_videos_published','idx_videos_kind') ORDER BY name;"
      - name: Aplicar SQL idempotente 008
        run: npx wrangler d1 execute alternativay-websub --remote --file=migrations-008-indices.sql --yes
      - name: Verificar índices creados
        run: |
          npx wrangler d1 execute alternativay-websub --remote --command="SELECT name, tbl_name FROM sqlite_master WHERE type='index' AND name IN ('idx_events_received','idx_events_video','idx_runs_at','idx_videos_channel','idx_videos_published','idx_videos_kind') ORDER BY name;"
