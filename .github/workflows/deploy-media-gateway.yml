name: Deploy · Media Gateway

on:
  push:
    branches: [main]
    paths:
      - 'apps/media-gateway/**'
      - 'apps/web/scripts/live-media-gateway-smoke.mjs'
      - '.github/workflows/deploy-media-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar Gateway y probar reproducción real en producción
    runs-on: ubuntu-latest
    environment: produccion
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: e48698b986db439c7b5509c37d219c9a
      GATEWAY_URL: https://todotube-media-gateway.papelon.workers.dev
      WEB_URL: https://todotube.papelon.workers.dev
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web and Playwright dependencies
        run: npm ci
      - name: Install browser and video fixture encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
      - name: Create valid, synthetic WebM video fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/todotube-media-e2e"
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=640x360:rate=30" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 8 -c:v libvpx -deadline realtime -cpu-used 8 -b:v 500k \
            -c:a libopus -b:a 64k -f webm \
            "$RUNNER_TEMP/todotube-media-e2e/fixture.webm"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 \
            "$RUNNER_TEMP/todotube-media-e2e/fixture.webm"
          test "$(stat -c%s "$RUNNER_TEMP/todotube-media-e2e/fixture.webm")" -gt 1024
      - name: Generate temporary worker identity
        id: test-identity
        run: |
          set -euo pipefail
          worker_name="todotube-gateway-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          media_id="e2e_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          test_token="$(openssl rand -hex 32)"
          echo "::add-mask::$test_token"
          echo "worker_name=$worker_name" >> "$GITHUB_OUTPUT"
          echo "media_id=$media_id" >> "$GITHUB_OUTPUT"
          echo "worker_url=https://$worker_name.papelon.workers.dev" >> "$GITHUB_OUTPUT"
          echo "MEDIA_TEST_TOKEN=$test_token" >> "$GITHUB_ENV"
          cat > "$GITHUB_WORKSPACE/apps/media-gateway/test/live-e2e.wrangler.toml" <<EOF
          name = "$worker_name"
          main = "./live-e2e-worker.mjs"
          account_id = "e48698b986db439c7b5509c37d219c9a"
          compatibility_date = "2025-09-01"
          workers_dev = true

          [[r2_buckets]]
          binding = "MEDIA_BUCKET"
          bucket_name = "todotube-media"

          [[r2_buckets]]
          binding = "MEDIA_BUCKET_REPLICA"
          bucket_name = "todotube-media-replica"
          EOF
      - name: Deploy isolated, secret-protected R2 fixture worker
        run: npx wrangler deploy --config "$GITHUB_WORKSPACE/apps/media-gateway/test/live-e2e.wrangler.toml"
      - name: Add ephemeral test secret to fixture worker
        env:
          TEST_TOKEN: ${{ env.MEDIA_TEST_TOKEN }}
        run: printf '%s' "$TEST_TOKEN" | npx wrangler secret put MEDIA_TEST_TOKEN --config "$GITHUB_WORKSPACE/apps/media-gateway/test/live-e2e.wrangler.toml"
      - name: Upload synthetic test video to both production R2 buckets
        env:
          WORKER_URL: ${{ steps.test-identity.outputs.worker_url }}
          MEDIA_ID: ${{ steps.test-identity.outputs.media_id }}
          TEST_TOKEN: ${{ steps.test-identity.outputs.test_token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$WORKER_URL/setup/$MEDIA_ID" \
            -H "Authorization: Bearer $TEST_TOKEN" \
            -H "Content-Type: video/webm" \
            --data-binary "@$RUNNER_TEMP/todotube-media-e2e/fixture.webm" \
            | tee "$RUNNER_TEMP/todotube-media-e2e/setup.json"
      - name: Verify primary R2, HTTP media contract and real web player
        env:
          MEDIA_ID: ${{ steps.test-identity.outputs.media_id }}
          MEDIA_FILE: ${{ runner.temp }}/todotube-media-e2e/fixture.webm
          EXPECTED_ORIGIN: primary
          EVIDENCE_DIR: ${{ runner.temp }}/todotube-media-e2e/evidence
        run: node scripts/live-media-gateway-smoke.mjs
      - name: Remove replica copy to prove primary source selection
        env:
          WORKER_URL: ${{ steps.test-identity.outputs.worker_url }}
          MEDIA_ID: ${{ steps.test-identity.outputs.media_id }}
          TEST_TOKEN: ${{ steps.test-identity.outputs.test_token }}
        run: curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $TEST_TOKEN" "$WORKER_URL/drop-replica/$MEDIA_ID"
      - name: Restore replica and verify same-version metadata
        env:
          WORKER_URL: ${{ steps.test-identity.outputs.worker_url }}
          MEDIA_ID: ${{ steps.test-identity.outputs.media_id }}
          TEST_TOKEN: ${{ steps.test-identity.outputs.test_token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$WORKER_URL/restore-replica/$MEDIA_ID" \
            -H "Authorization: Bearer $TEST_TOKEN" \
            -H "Content-Type: video/webm" \
            --data-binary "@$RUNNER_TEMP/todotube-media-e2e/fixture.webm"
      - name: Remove primary copy to force same-asset replica failover
        env:
          WORKER_URL: ${{ steps.test-identity.outputs.worker_url }}
          MEDIA_ID: ${{ steps.test-identity.outputs.media_id }}
          TEST_TOKEN: ${{ steps.test-identity.outputs.test_token }}
        run: curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $TEST_TOKEN" "$WORKER_URL/drop-primary/$MEDIA_ID"
      - name: Verify replica failover, HTTP ranges and real web player
        env:
          MEDIA_ID: ${{ steps.test-identity.outputs.media_id }}
          MEDIA_FILE: ${{ runner.temp }}/todotube-media-e2e/fixture.webm
          EXPECTED_ORIGIN: replica-1
          EVIDENCE_DIR: ${{ runner.temp }}/todotube-media-e2e/evidence
        run: node scripts/live-media-gateway-smoke.mjs
      - name: Upload browser screenshots, playback traces and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todotube-live-media-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/todotube-media-e2e/
          retention-days: 14
          if-no-files-found: warn
      - name: Delete temporary media from primary and replica
        if: always() && steps.test-identity.outputs.worker_url != ''
        env:
          WORKER_URL: ${{ steps.test-identity.outputs.worker_url }}
          MEDIA_ID: ${{ steps.test-identity.outputs.media_id }}
          TEST_TOKEN: ${{ steps.test-identity.outputs.test_token }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST -H "Authorization: Bearer $TEST_TOKEN" \
            "$WORKER_URL/cleanup/$MEDIA_ID" || echo "::warning::Could not confirm test object cleanup"
      - name: Delete the temporary fixture Worker and its secret
        if: always() && steps.test-identity.outputs.worker_name != ''
        env:
          WORKER_NAME: ${{ steps.test-identity.outputs.worker_name }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          echo "$response" | jq -e '.success == true'
