name: Deploy · Media Gateway

on:
  push:
    branches: [main]
    paths:
      - 'apps/media-gateway/**'
      - '.github/workflows/deploy-media-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Provisionar R2 y publicar Gateway multimedia
    runs-on: ubuntu-latest
    environment: produccion
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar token configurado
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Instalar dependencias del Gateway
        working-directory: apps/web
        run: npm ci
      - name: Crear buckets R2 si todavía no existen
        working-directory: apps/web
        run: |
          set -euo pipefail
          for bucket in todotube-media todotube-media-replica; do
            if npx wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then
              echo "R2 bucket disponible: $bucket"
            else
              echo "Creando R2 bucket: $bucket"
              npx wrangler r2 bucket create "$bucket"
            fi
          done
      - name: Publicar Gateway multimedia
        working-directory: apps/web
        run: npx wrangler deploy --config ../media-gateway/wrangler.toml
      - name: Verificar salud del Gateway en producción
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error https://todotube-media-gateway.papelon.workers.dev/health)"
          echo "$response" | jq -e '.ok == true and .originsConfigured == 2 and .originsAvailable == 2 and .degraded == false'
