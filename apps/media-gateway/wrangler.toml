# Worker EXPERIMENTAL del gateway multimedia (spec 008, ADR-009). Independiente de apps/web/wrangler.toml.
# NO desplegar: sin rutas ni dominio; workers_dev = false evita publicarlo en *.workers.dev por error.
name = "todotube-media-gateway-dev"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Cancelación: el runtime aborta request.signal cuando el cliente se desconecta.
compatibility_flags = ["enable_request_signal"]
workers_dev = false

[vars]
GATEWAY_ENABLED = "1"           # interruptor: cualquier otro valor devuelve 503
ORIGIN_BASE = "http://127.0.0.1:8788/fixtures/"   # origen de prueba LOCAL controlado por el proyecto
DEV_ALLOW_LOOPBACK = "1"        # solo en desarrollo: permite el origen local; en cualquier otro caso se exige https público
ASSETS = "test-video.mp4,test-video.webm,test-dash.mpd,dash-0.mp4,dash-1.mp4,slow.mp4,nolength.mp4,error.mp4,redirect.mp4,missing.mp4"
ALLOWED_ORIGINS = "http://127.0.0.1:8790"          # página de prueba (otro origen: ejercita CORS de verdad)
RATE_LIMIT_PER_MIN = "600"
